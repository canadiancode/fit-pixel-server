# Install on the droplet (after Let's Encrypt certs exist):
#   sudo cp deploy/nginx-api.aurashields.com.conf /etc/nginx/sites-available/api.aurashields.com
#   sudo ln -sf /etc/nginx/sites-available/api.aurashields.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Fresh box: issue certs first (`certbot --nginx -d api.aurashields.com --redirect`),
# then copy this file so HTTP 301 + HSTS are source-controlled.

server {
    listen 80;
    listen [::]:80;
    server_name api.aurashields.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.aurashields.com;

    ssl_certificate /etc/letsencrypt/live/api.aurashields.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aurashields.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
