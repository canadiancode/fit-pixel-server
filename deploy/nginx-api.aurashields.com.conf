# Install on the droplet:
#   sudo cp deploy/nginx-api.aurashields.com.conf /etc/nginx/sites-available/api.aurashields.com
#   sudo ln -sf /etc/nginx/sites-available/api.aurashields.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then: sudo certbot --nginx -d api.aurashields.com
#
# Certbot will add TLS listen blocks and certificates automatically.

server {
    listen 80;
    listen [::]:80;
    server_name api.aurashields.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
